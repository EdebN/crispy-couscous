name: Prediction Lab integrity tests

on:
  push:
    branches: [main, phase-0-benchmark-integrity]
  pull_request:
    branches: [main]

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check historical-tester.js
      - name: Run deterministic benchmark integrity tests
        run: node --test tests/historical-tester.test.js
